<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>NEXUS // Warrior Arena</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Poppins:wght@400;600;700&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020306;
    font-family:Poppins,sans-serif;
    color:#fff;
}

canvas{
    position:fixed;
    inset:0;
}

/* HUD */

#hud{
    position:fixed;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    z-index:5;
    pointer-events:none;
}

.panel{
    background:#080d15dd;
    border:1px solid #263449;
    border-radius:12px;
    padding:12px 16px;
    backdrop-filter:blur(10px);
}

.title{
    font:800 16px Orbitron;
    color:#00eaff;
    letter-spacing:1px;
}

.label{
    color:#7e8ba0;

}

}

#score{

}

    position:fixed;

#screen{

#jumpscare{

}

}

.tooth{

}

.tooth:nth-child(1){left:15px}
.tooth:nth-child(2){left:45px}

.tooth:nth-child(4){left:105px}
.tooth:nth-child(5){right:105px}
.tooth:nth-child(6){right:75px}
.tooth:nth-child(7){right:45px}

.scareText{

@keyframes monsterZoom{

    }

@keyframes scareText{

@media(max-width:800px),(pointer:coarse){

        </h1>

            Enter the arena, destroy the incoming enemies,
            survive every wave and achieve the highest score.
        </p>

            ENTER THE ARENA
        </button>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W,H;

function resize(){

    W=canvas.width=innerWidth;
    H=canvas.height=innerHeight;

}

addEventListener("resize",resize);
resize();


/* GAME */

let running=false;
let paused=false;

let score=0;
let wave=1;

let player;
let enemies=[];
let particles=[];
let stars=[];

let spawnTimer=0;
let attackCooldown=0;
let attackEffect=0;

let keys={};

let muted=false;
let audio=null;

let lastTime=0;


/* AUDIO */

function initAudio(){

    if(audio)return;

    audio =
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

}

function sound(
    frequency,
    duration,
    type="sine",
    volume=.04
){

    if(muted)return;

    initAudio();

    const o =
        audio.createOscillator();

    const g =
        audio.createGain();

    o.type=type;
    o.frequency.value=frequency;

    g.gain.value=volume;

    o.connect(g);
    g.connect(audio.destination);

    const now=audio.currentTime;

    g.gain.setValueAtTime(
        volume,
        now
    );

    g.gain.exponentialRampToValueAtTime(
        .001,
        now+duration
    );

    o.start(now);
    o.stop(now+duration);

}


/* JUMPSCARE SOUND */

function jumpscareSound(){

    if(muted)return;

    initAudio();

    sound(
        55,
        .8,
        "sawtooth",
        .12
    );

    setTimeout(()=>{
        sound(
            900,
            .12,
            "square",
            .08
        );
    },100);

    setTimeout(()=>{
        sound(
            150,
            .6,
            "sawtooth",
            .09
        );
    },180);

}


/* INPUT */

addEventListener("keydown",e=>{

    const key=e.key.toLowerCase();

    keys[key]=true;

    if(key===" "){
        e.preventDefault();
    }

    if(key==="p"){
        togglePause();
    }

});

addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

});


/* STARS */

function createStars(){

    stars=[];

    for(let i=0;i<130;i++){

        stars.push({

            x:Math.random()*W,
            y:Math.random()*H,
            r:Math.random()*1.5+.3,
            speed:Math.random()*25+5

        });

    }

}


/* START */

function startGame(){

    initAudio();

    score=0;
    wave=1;

    player={

        x:W/2,
        y:H/2,

        r:23,

        speed:300,

        hp:100,
        maxHp:100,

        direction:1

    };

    enemies=[];
    particles=[];

    spawnTimer=0;
    attackCooldown=0;
    attackEffect=0;

    running=true;
    paused=false;

    document
        .getElementById("screen")
        .classList.add("hidden");

    document
        .getElementById("jumpscare")
        .classList.remove("active");

    createStars();

    lastTime=performance.now();

    requestAnimationFrame(loop);

}


/* ENEMY */

function spawnEnemy(){

    const side=
        Math.floor(Math.random()*4);

    let x,y;

    const pad=70;

    if(side===0){
        x=-pad;
        y=Math.random()*H;
    }

    if(side===1){
        x=W+pad;
        y=Math.random()*H;
    }

    if(side===2){
        x=Math.random()*W;
        y=-pad;
    }

    if(side===3){
        x=Math.random()*W;
        y=H+pad;
    }

    enemies.push({

        x,y,

        r:16+Math.random()*8,

        speed:
            65+
            wave*8+
            Math.random()*35,

        hp:
            1+
            Math.floor(wave/3),

        maxHp:
            1+
            Math.floor(wave/3),

        hit:0

    });

}


/* PARTICLES */

function burst(x,y,count=12){

    for(let i=0;i<count;i++){

        const a=
            Math.random()*
            Math.PI*2;

        const speed=
            60+Math.random()*180;

        particles.push({

            x,y,

            vx:Math.cos(a)*speed,
            vy:Math.sin(a)*speed,

            life:.4+
                Math.random()*.5

        });

    }

}


/* ATTACK */

function attack(){

    if(!running || paused)return;

    if(attackCooldown>0)return;

    attackCooldown=.35;
    attackEffect=.16;

    sound(
        180,
        .08,
        "sawtooth",
        .06
    );

    sound(
        420,
        .06,
        "square",
        .035
    );

    for(const enemy of enemies){

        const dx=
            enemy.x-player.x;

        const dy=
            enemy.y-player.y;

        const distance=
            Math.hypot(dx,dy);

        const front=
            dx*player.direction>-25;

        if(
            distance<100 &&
            front
        ){

            enemy.hp--;
            enemy.hit=.12;

            burst(
                enemy.x,
                enemy.y,
                7
            );

            if(enemy.hp<=0){

                score+=
                    100+
                    wave*15;

                burst(
                    enemy.x,
                    enemy.y,
                    20
                );

                sound(
                    90,
                    .1,
                    "square",
                    .04
                );

            }

        }

    }

    enemies=
        enemies.filter(
            e=>e.hp>0
        );

}


/* UPDATE */

function update(dt){

    let dx=0;
    let dy=0;

    if(keys.w||keys.arrowup)dy--;
    if(keys.s||keys.arrowdown)dy++;

    if(keys.a||keys.arrowleft){

        dx--;
        player.direction=-1;

    }

    if(keys.d||keys.arrowright){

        dx++;
        player.direction=1;

    }

    const length=
        Math.hypot(dx,dy)||1;

    player.x+=
        dx/length*
        player.speed*
        dt;

    player.y+=
        dy/length*
        player.speed*
        dt;

    player.x=
        Math.max(
            35,
            Math.min(W-35,player.x)
        );

    player.y=
        Math.max(
            90,
            Math.min(H-35,player.y)
        );


    attackCooldown-=dt;

    attackEffect=
        Math.max(
            0,
            attackEffect-dt
        );

    if(keys[" "]){
        attack();
    }


    spawnTimer-=dt;

    const maxEnemies=
        4+wave*2;

    if(
        spawnTimer<=0 &&
        enemies.length<maxEnemies
    ){

        spawnEnemy();

        spawnTimer=
            Math.max(
                .25,
                1.1-wave*.045
            );

    }


    for(const enemy of enemies){

        enemy.hit=
            Math.max(
                0,
                enemy.hit-dt
            );

        const dx=
            player.x-enemy.x;

        const dy=
            player.y-enemy.y;

        const distance=
            Math.hypot(dx,dy)||1;

        enemy.x+=
            dx/distance*
            enemy.speed*
            dt;

        enemy.y+=
            dy/distance*
            enemy.speed*
            dt;

        if(
            distance<
            player.r+enemy.r
        ){

            player.hp-=
                18*dt;

            enemy.x-=
                dx/distance*12;

            enemy.y-=
                dy/distance*12;

        }

    }


    if(score>=wave*800){

        wave++;

        player.maxHp+=5;

        player.hp=
            Math.min(
                player.maxHp,
                player.hp+25
            );

        burst(
            player.x,
            player.y,
            30
        );

        sound(
            330,
            .12,
            "triangle",
            .06
        );

    }


    for(const p of particles){

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.life-=dt;

    }

    particles=
        particles.filter(
            p=>p.life>0
        );


    for(const star of stars){

        star.y+=star.speed*dt;

        if(star.y>H){

            star.y=0;
            star.x=Math.random()*W;

        }

    }


    document.getElementById("hp")
        .style.width=
        Math.max(
            0,
            player.hp/player.maxHp*100
        )+"%";

    document.getElementById("score")
        .textContent=
        String(score).padStart(4,"0");

    document.getElementById("wave")
        .textContent=wave;


    if(player.hp<=0){

        gameOver();

    }

}


/* DRAW */

function draw(){

    const gradient=
        ctx.createLinearGradient(
            0,0,0,H
        );

    gradient.addColorStop(
        0,
        "#08111c"
    );

    gradient.addColorStop(
        1,
        "#020408"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,0,W,H
    );


    /* stars */

    for(const star of stars){

        ctx.fillStyle="#00eaff99";

        ctx.beginPath();

        ctx.arc(
            star.x,
            star.y,
            star.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    /* grid */

    ctx.strokeStyle="#101d29";

    const grid=55;

    for(
        let x=0;
        x<W;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,75);
        ctx.lineTo(x,H);

        ctx.stroke();

    }

    for(
        let y=75;
        y<H;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(0,y);
        ctx.lineTo(W,y);

        ctx.stroke();

    }


    /* particles */

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(
                0,
                p.life*2
            );

        ctx.fillStyle="#00eaff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;


    /* enemies */

    for(const enemy of enemies){

        ctx.save();

        ctx.translate(
            enemy.x,
            enemy.y
        );

        ctx.shadowBlur=20;

        ctx.shadowColor=
            enemy.hit
            ? "#fff"
            : "#ff3655";

        ctx.fillStyle=
            enemy.hit
            ? "#fff"
            : "#ff3655";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            enemy.r,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.shadowBlur=0;

        ctx.fillStyle="#16050a";

        ctx.beginPath();

        ctx.arc(
            -5,-3,3,
            0,
            Math.PI*2
        );

        ctx.arc(
            5,-3,3,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

    }


    /* player */

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.scale(
        player.direction,
        1
    );

    ctx.shadowBlur=30;
    ctx.shadowColor="#00eaff";

    ctx.fillStyle="#00eaff";

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        player.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="#07121b";

    ctx.beginPath();

    ctx.arc(
        0,
        -4,
        15,
        Math.PI,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.arc(
        -6,-5,3,
        0,
        Math.PI*2
    );

    ctx.arc(
        6,-5,3,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* sword */

    ctx.strokeStyle="#e7fbff";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.moveTo(
        12,-5
    );

    ctx.lineTo(
        52,-20
    );

    ctx.stroke();


    if(attackEffect>0){

        ctx.strokeStyle="#fff";
        ctx.lineWidth=7;

        ctx.shadowBlur=25;
        ctx.shadowColor="#00eaff";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            78,
            -.85,
            .85
        );

        ctx.stroke();

    }

    ctx.restore();

}


/* GAME OVER + JUMPSCARE */

function gameOver(){

    if(!running)return;

    running=false;

    jumpscareSound();

    const best=
        Number(
            localStorage.getItem(
                "nexusBest"
            )||0
        );

    if(score>best){

        localStorage.setItem(
            "nexusBest",
            score
        );

    }

    document
        .getElementById("jumpscare")
        .classList.add("active");


    /*
       JUMPSCARE STAYS ON SCREEN
       FOR 2.7 SECONDS
    */

    setTimeout(()=>{

        document
            .getElementById("jumpscare")
            .classList.remove("active");

        showGameOver();

    },2700);

}


/* FINAL SCREEN */

function showGameOver(){

    const best=
        Number(
            localStorage.getItem(
                "nexusBest"
            )||0
        );

    document
        .getElementById("screen")
        .classList.remove("hidden");

    document
        .getElementById("screen")
        .innerHTML=`

        <div class="modal">

            <h1>
                GAME <span>OVER</span>
            </h1>

            <p>

                The monster found you.

                <br><br>

                SCORE:
                <strong style="color:#ffd45a">
                    ${score}
                </strong>

                <br>

                WAVE:
                <strong style="color:#00eaff">
                    ${wave}
                </strong>

                <br>

                BEST:
                <strong style="color:#8b5cf6">
                    ${best}
                </strong>

            </p>

            <button
                class="play"
                onclick="startGame()"
            >
                PLAY AGAIN
            </button>

        </div>

        `;

}


/* PAUSE */

function togglePause(){

    if(!running)return;

    paused=!paused;

    document
        .getElementById("pauseScreen")
        .classList.toggle(
            "show",
            paused
        );

    document
        .getElementById("pause")
        .textContent=
        paused ? "▶" : "Ⅱ";

}


/* LOOP */

function loop(time){

    if(!running)return;

    const dt=
        Math.min(
            .033,
            (time-lastTime)/1000
        );

    lastTime=time;

    if(!paused){

        update(dt);

    }

    draw();

    requestAnimationFrame(loop);

}


/* BUTTONS */

document
    .getElementById("start")
    .onclick=startGame;

document
    .getElementById("pause")
    .onclick=togglePause;

document
    .getElementById("resume")
    .onclick=togglePause;

document
    .getElementById("mute")
    .onclick=()=>{

        muted=!muted;

        document
            .getElementById("mute")
            .textContent=
            muted ? "🔇" : "🔊";

    };


/* MOBILE ATTACK */

document
    .getElementById("attack")
    .addEventListener(
        "touchstart",
        e=>{
            e.preventDefault();
            attack();
        },
        {passive:false}
    );


/* MOBILE MOVEMENT */

document
    .querySelectorAll("[data-key]")
    .forEach(button=>{

        const key=button.dataset.key;

        const setKey=value=>{

            if(key==="up")
                keys.arrowup=value;

            if(key==="down")
                keys.arrowdown=value;

            if(key==="left")
                keys.arrowleft=value;

            if(key==="right")
                keys.arrowright=value;

        };

        button.addEventListener(
            "touchstart",
            e=>{
                e.preventDefault();
                setKey(true);
            },
            {passive:false}
        );

        button.addEventListener(
            "touchend",
            e=>{
                e.preventDefault();
                setKey(false);
            },
            {passive:false}
        );

        button.addEventListener(
            "mousedown",
            ()=>{
                setKey(true);
            }
        );

        button.addEventListener(
            "mouseup",
            ()=>{
                setKey(false);
            }
        );

    });

</script>
