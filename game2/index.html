<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NEON DRIVE // 3D Horror Racing</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070a;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

/* =========================================================
   HUD
========================================================= */

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:10;
}

#speedBox{
    position:absolute;
    left:25px;
    bottom:25px;
    width:190px;
    padding:18px;
    border:1px solid rgba(255,255,255,.2);
    border-radius:15px;
    background:rgba(5,8,12,.78);
    backdrop-filter:blur(10px);
    color:white;
}

#speed{
    font-size:45px;
    font-weight:bold;
}

#kmh{
    color:#8d9aaa;
    font-size:12px;
    letter-spacing:2px;
}

#gear{
    margin-top:8px;
    font-size:14px;
    color:#00eaff;
}

#scoreBox{
    position:absolute;
    top:25px;
    right:25px;
    padding:15px 20px;
    background:rgba(5,8,12,.75);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    color:white;
    text-align:right;
}

#score{
    font-size:24px;
    font-weight:bold;
}

#controls{
    position:absolute;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    color:#b9c2cc;
    background:rgba(0,0,0,.55);
    padding:10px 18px;
    border-radius:8px;
    font-size:12px;
}

/* =========================================================
   START SCREEN
========================================================= */

#start{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at center,
            #172b3b,
            #05080c 60%,
            #010204
        );
}

.panel{
    width:min(600px,90%);
    padding:50px;
    text-align:center;
    background:rgba(5,8,12,.94);
    border:1px solid #263746;
    border-radius:20px;
    box-shadow:0 30px 100px #000;
    color:white;
}

h1{
    font-size:52px;
    letter-spacing:6px;
    margin-bottom:15px;
}

h1 span{
    color:#00eaff;
}

.subtitle{
    color:#9ca8b5;
    line-height:1.8;
    margin-bottom:30px;
}

button{
    padding:15px 35px;
    border:0;
    border-radius:8px;
    background:#00d9ff;
    color:#001017;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    transition:.2s;
}

button:hover{
    filter:brightness(1.2);
    transform:translateY(-2px);
}

/* =========================================================
   DAMAGE
========================================================= */

#damage{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
    border:0 solid rgba(255,0,0,.55);
    transition:.1s;
}

/* =========================================================
   HORROR SCREEN
========================================================= */

#horrorFlash{
    position:fixed;
    inset:0;
    z-index:1000;
    background:white;
    opacity:0;
    pointer-events:none;
}

#horrorFlash.flash{
    animation:flashEffect .35s;
}

@keyframes flashEffect{

    0%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}


/* FULL SCREEN JUMPSCARE */

#horrorScreen{
    position:fixed;
    inset:0;

    z-index:999;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle,
            #180000 0%,
            #050000 45%,
            #000 100%
        );

    opacity:0;
    pointer-events:none;

    transition:opacity .08s;
}

#horrorScreen.active{
    opacity:1;
}


/* HORROR FACE */

#horrorFace{

    width:min(430px,75vw);
    height:min(430px,75vw);

    border-radius:50%;

    position:relative;

    background:
        radial-gradient(
            circle at 34% 37%,
            white 0 7%,
            transparent 8%
        ),

        radial-gradient(
            circle at 66% 37%,
            white 0 7%,
            transparent 8%
        ),

        radial-gradient(
            circle at 34% 37%,
            red 0 3%,
            transparent 4%
        ),

        radial-gradient(
            circle at 66% 37%,
            red 0 3%,
            transparent 4%
        ),

        radial-gradient(
            circle at center,
            #151515,
            #020202 70%
        );

    border:10px solid #280000;

    box-shadow:
        0 0 25px red,
        0 0 80px #600000,
        inset 0 0 100px #000;

    transform:scale(.1);

    transition:
        transform .1s cubic-bezier(.1,1.8,.2,1);

}

#horrorScreen.active #horrorFace{
    transform:scale(1);
}


/* FACE MOUTH */

#horrorFace::before{

    content:"";

    position:absolute;

    left:18%;
    right:18%;
    bottom:18%;

    height:25%;

    background:#020202;

    border-radius:
        15px 15px
        50% 50%;

    border-top:
        8px solid #720000;

}


/* TEETH */

#horrorFace::after{

    content:"";

    position:absolute;

    left:27%;
    right:27%;
    top:58%;

    height:9%;

    background:#eee;

    clip-path:polygon(
        0 0,
        10% 100%,
        20% 0,
        30% 100%,
        40% 0,
        50% 100%,
        60% 0,
        70% 100%,
        80% 0,
        90% 100%,
        100% 0
    );

}


/* HORROR TEXT */

#horrorText{

    position:absolute;

    bottom:8%;

    width:100%;

    text-align:center;

    color:#ff2020;

    font-size:
        clamp(
            25px,
            5vw,
            60px
        );

    font-weight:900;

    letter-spacing:9px;

    text-shadow:
        0 0 10px red,
        0 0 30px red;

    animation:
        horrorText .08s
        infinite alternate;

}

@keyframes horrorText{

    from{
        transform:translateX(-4px);
    }

    to{
        transform:translateX(4px);
    }

}


/* MESSAGE */

#eatenMessage{

    position:absolute;

    top:9%;

    width:100%;

    text-align:center;

    color:#ff3030;

    font-size:
        clamp(
            18px,
            3vw,
            32px
        );

    font-weight:bold;

    letter-spacing:5px;

    text-shadow:
        0 0 15px red;

}


/* HIDDEN */

.hidden{
    display:none!important;
}

</style>
</head>


<body>


<!-- =========================================================
     START SCREEN
========================================================= -->

<div id="start">

    <div class="panel">

        <h1>
            NEON <span>DRIVE</span>
        </h1>

        <div class="subtitle">

            REAL-TIME 3D STREET RACING

            <br><br>

            Drive through the city.

            <br>

            Avoid traffic.

            <br>

            Push your car to maximum speed.

            <br><br>

            <strong style="color:#ff3333">
                WARNING: SOME CARS ARE NOT NORMAL...
            </strong>

        </div>

        <button id="startButton">
            START ENGINE
        </button>

    </div>

</div>


<!-- =========================================================
     HUD
========================================================= -->

<div id="hud">

    <div id="scoreBox">

        <div
            style="
                font-size:10px;
                color:#8794a2
            "
        >
            DISTANCE
        </div>

        <div id="score">
            0 m
        </div>

    </div>


    <div id="speedBox">

        <div id="speed">
            0
        </div>

        <div id="kmh">
            KM/H
        </div>

        <div id="gear">
            GEAR N
        </div>

    </div>


    <div id="controls">

        W / ↑ ACCELERATE

        &nbsp; • &nbsp;

        S / ↓ BRAKE

        &nbsp; • &nbsp;

        A D / ← → STEER

    </div>

</div>


<!-- DAMAGE EFFECT -->

<div id="damage"></div>


<!-- =========================================================
     HORROR EFFECT
========================================================= -->

<div id="horrorFlash"></div>


<div id="horrorScreen">

    <div id="eatenMessage">
        THEY GOT YOU...
    </div>

    <div id="horrorFace"></div>

    <div id="horrorText">
        GAME OVER
    </div>

</div>


<!-- =========================================================
     THREE.JS
========================================================= -->

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================================================
   GAME VARIABLES
========================================================= */

let scene;
let camera;
let renderer;

let car;

let wheels=[];

let keys={};

let started=false;

let speed=0;

let steering=0;

let distance=0;

let health=100;

let traffic=[];

let rain=[];

let clock=new THREE.Clock();

let audioContext=null;

let engineOscillator=null;

let engineGain=null;


/* =========================================================
   HORROR VARIABLES
========================================================= */

let horrorActive=false;

let horrorTimer=0;

let horrorLaughStarted=false;


/* =========================================================
   CONSTANTS
========================================================= */

const MAX_SPEED=65;

const ACCELERATION=27;

const BRAKE=45;

const FRICTION=9;

const REVERSE_SPEED=18;


/* =========================================================
   AUDIO
========================================================= */

function startAudio(){

    if(audioContext)
        return;


    audioContext=
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    engineOscillator=
        audioContext.createOscillator();


    engineGain=
        audioContext.createGain();


    engineOscillator.type="sawtooth";


    engineOscillator.frequency.value=70;


    engineGain.gain.value=.035;


    engineOscillator.connect(
        engineGain
    );


    engineGain.connect(
        audioContext.destination
    );


    engineOscillator.start();

}


/* =========================================================
   ENGINE SOUND
========================================================= */

function updateEngineSound(){

    if(!audioContext)
        return;


    const ratio=
        Math.abs(speed)/
        MAX_SPEED;


    engineOscillator.frequency.value=
        65+
        ratio*180;


    engineGain.gain.value=
        .025+
        ratio*.06;

}


/* =========================================================
   HORROR LAUGH
========================================================= */

function evilLaugh(){

    if(
        !audioContext ||
        horrorLaughStarted
    )
        return;


    horrorLaughStarted=true;


    const now=
        audioContext.currentTime;


    const master=
        audioContext.createGain();


    master.gain.setValueAtTime(
        0,
        now
    );


    master.gain.linearRampToValueAtTime(
        .17,
        now+.05
    );


    master.gain.linearRampToValueAtTime(
        0,
        now+3
    );


    master.connect(
        audioContext.destination
    );


    /*
       Synthetic horror laugh.
       No external audio file required.
    */

    for(
        let i=0;
        i<8;
        i++
    ){

        const osc=
            audioContext.createOscillator();


        const gain=
            audioContext.createGain();


        osc.type="sawtooth";


        const start=
            now+
            i*.34;


        osc.frequency.setValueAtTime(
            190-i*14,
            start
        );


        osc.frequency.exponentialRampToValueAtTime(
            65,
            start+.27
        );


        gain.gain.setValueAtTime(
            0,
            start
        );


        gain.gain.linearRampToValueAtTime(
            .75,
            start+.035
        );


        gain.gain.exponentialRampToValueAtTime(
            .01,
            start+.3
        );


        osc.connect(gain);

        gain.connect(master);


        osc.start(start);

        osc.stop(
            start+.32
        );

    }

}


/* =========================================================
   HORROR EVENT
========================================================= */

function triggerHorror(){

    if(horrorActive)
        return;


    horrorActive=true;

    started=false;

    speed=0;

    horrorTimer=0;


    /* STOP ENGINE SOUND */

    if(engineGain){

        engineGain.gain.setTargetAtTime(
            0,
            audioContext.currentTime,
            .05
        );

    }


    /* WHITE FLASH */

    const flash=
        document.getElementById(
            "horrorFlash"
        );


    flash.classList.remove(
        "flash"
    );


    void flash.offsetWidth;


    flash.classList.add(
        "flash"
    );


    /* SHOW JUMPSCARE */

    document
        .getElementById(
            "horrorScreen"
        )
        .classList.add(
            "active"
        );


    /* PLAY EVIL LAUGH */

    evilLaugh();


    /* PREPARE TRAFFIC */

    traffic.forEach(
        (vehicle,index)=>{

            vehicle.userData.horror=
                true;


            vehicle.userData.horrorAngle=
                (
                    index/
                    traffic.length
                )*
                Math.PI*2;


            vehicle.userData.horrorRadius=
                7+
                (index%4)*2;

        }
    );


    /* RED SCREEN BORDER */

    const damageElement=
        document.getElementById(
            "damage"
        );


    damageElement.style.borderWidth=
        "45px";


    setTimeout(()=>{

        damageElement.style.borderWidth=
            "0";

    },700);


    /* RESTART */

    setTimeout(()=>{

        location.reload();

    },5000);

}


/* =========================================================
   INITIALIZATION
========================================================= */

function init(){

    scene=
        new THREE.Scene();


    scene.background=
        new THREE.Color(
            0x07101c
        );


    scene.fog=
        new THREE.Fog(
            0x07101c,
            50,
            300
        );


    /* CAMERA */

    camera=
        new THREE.PerspectiveCamera(
            65,
            innerWidth/innerHeight,
            .1,
            1000
        );


    /* RENDERER */

    renderer=
        new THREE.WebGLRenderer({
            antialias:true
        });


    renderer.setSize(
        innerWidth,
        innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            devicePixelRatio,
            2
        )
    );


    renderer.shadowMap.enabled=true;


    renderer.shadowMap.type=
        THREE.PCFSoftShadowMap;


    renderer.outputColorSpace=
        THREE.SRGBColorSpace;


    document.body.appendChild(
        renderer.domElement
    );


    createLights();

    createWorld();

    createCar();

    createTraffic();

    createRain();


    camera.position.set(
        0,
        5,
        12
    );


    /* WINDOW */

    window.addEventListener(
        "resize",
        resize
    );


    /* KEYBOARD */

    document.addEventListener(
        "keydown",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=true;

        }
    );


    document.addEventListener(
        "keyup",
        e=>{

            keys[
                e.key.toLowerCase()
            ]=false;

        }
    );


    /* START BUTTON */

    document.getElementById(
        "startButton"
    ).onclick=startGame;


    animate();

}


/* =========================================================
   LIGHTING
========================================================= */

function createLights(){

    const ambient=
        new THREE.HemisphereLight(
            0x9bbcff,
            0x080808,
            1.5
        );


    scene.add(
        ambient
    );


    const moon=
        new THREE.DirectionalLight(
            0x9abfff,
            2
        );


    moon.position.set(
        -50,
        80,
        -60
    );


    moon.castShadow=true;


    moon.shadow.mapSize.width=
        2048;


    moon.shadow.mapSize.height=
        2048;


    scene.add(
        moon
    );


    const streetLight=
        new THREE.PointLight(
            0x00bfff,
            15,
            60
        );


    streetLight.position.set(
        0,
        8,
        -20
    );


    scene.add(
        streetLight
    );

}


/* =========================================================
   WORLD
========================================================= */

function createWorld(){

    /* ROAD */

    const road=
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                22,
                1000
            ),

            new THREE.MeshStandardMaterial({
                color:0x171a1f,
                roughness:.9
            })

        );


    road.rotation.x=
        -Math.PI/2;


    road.position.y=
        -.02;


    road.receiveShadow=true;


    scene.add(
        road
    );


    /* SIDEWALKS */

    const sidewalkMaterial=
        new THREE.MeshStandardMaterial({
            color:0x555b61,
            roughness:1
        });


    [-14,14].forEach(
        x=>{

            const sidewalk=
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        7,
                        .3,
                        1000
                    ),

                    sidewalkMaterial

                );


            sidewalk.position.set(
                x,
                .15,
                0
            );


            sidewalk.receiveShadow=true;


            scene.add(
                sidewalk
            );

        }
    );


    /* LANE MARKINGS */

    for(
        let z=-490;
        z<500;
        z+=10
    ){

        const line=
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    .22,
                    .03,
                    5
                ),

                new THREE.MeshBasicMaterial({
                    color:0xffffff
                })

            );


        line.position.set(
            0,
            .04,
            z
        );


        scene.add(
            line
        );

    }


    /* BUILDINGS */

    for(
        let z=-450;
        z<450;
        z+=18
    ){

        createBuilding(
            -23,
            z
        );


        createBuilding(
            23,
            z+8
        );

    }


    /* TREES */

    for(
        let i=0;
        i<100;
        i++
    ){

        const side=
            Math.random()<.5
            ?-1
            :1;


        const tree=
            createTree();


        tree.position.set(

            side*
            (
                18+
                Math.random()*15
            ),

            0,

            -450+
            Math.random()*900

        );


        scene.add(
            tree
        );

    }

}


/* =========================================================
   BUILDING
========================================================= */

function createBuilding(
    x,
    z
){

    const width=
        5+
        Math.random()*8;


    const height=
        8+
        Math.random()*25;


    const depth=
        8+
        Math.random()*10;


    const building=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            new THREE.MeshStandardMaterial({

                color:
                    new THREE.Color(
                        .08+
                        Math.random()*.1,

                        .09+
                        Math.random()*.1,

                        .12+
                        Math.random()*.1
                    ),

                roughness:.9

            })

        );


    building.position.set(
        x,
        height/2,
        z
    );


    building.castShadow=true;

    building.receiveShadow=true;


    scene.add(
        building
    );


    /* WINDOWS */

    for(
        let y=4;
        y<height-1;
        y+=4
    ){

        const windowLight=
            new THREE.Mesh(

                new THREE.PlaneGeometry(
                    1.1,
                    1.2
                ),

                new THREE.MeshBasicMaterial({

                    color:
                        Math.random()>.35
                        ?0xffd76a
                        :0x111820

                })

            );


        windowLight.position.set(
            x-width/2-.01,
            y,
            z
        );


        windowLight.rotation.y=
            -Math.PI/2;


        scene.add(
            windowLight
        );

    }

}


/* =========================================================
   TREE
========================================================= */

function createTree(){

    const group=
        new THREE.Group();


    const trunk=
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .25,
                .45,
                4,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x3a2618
            })

        );


    trunk.position.y=2;

    trunk.castShadow=true;


    const leaves=
        new THREE.Mesh(

            new THREE.ConeGeometry(
                2.4,
                6,
                8
            ),

            new THREE.MeshStandardMaterial({
                color:0x102d1b
            })

        );


    leaves.position.y=6;

    leaves.castShadow=true;


    group.add(
        trunk,
        leaves
    );


    return group;

}


/* =========================================================
   PLAYER CAR
========================================================= */

function createCar(){

    car=
        new THREE.Group();


    /* BODY */

    const body=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.5,
                .65,
                5
            ),

            new THREE.MeshStandardMaterial({

                color:0x0b5cff,

                metalness:.8,

                roughness:.25

            })

        );


    body.position.y=.85;

    body.castShadow=true;


    /* HOOD */

    const hood=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2.3,
                .25,
                1.8
            ),

            new THREE.MeshStandardMaterial({

                color:0x0a48c9,

                metalness:.8,

                roughness:.25

            })

        );


    hood.position.set(
        0,
        1.25,
        -1.25
    );


    hood.castShadow=true;


    /* CABIN */

    const cabin=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.8,
                .85,
                2
            ),

            new THREE.MeshStandardMaterial({

                color:0x07121c,

                metalness:.2,

                roughness:.1

            })

        );


    cabin.position.set(
        0,
        1.45,
        .45
    );


    /* ROOF */

    const roof=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.65,
                .12,
                1.7
            ),

            new THREE.MeshStandardMaterial({

                color:0x05070a,

                metalness:.8,

                roughness:.2

            })

        );


    roof.position.set(
        0,
        1.92,
        .45
    );


    car.add(
        body,
        hood,
        cabin,
        roof
    );


    /* WHEELS */

    const wheelPositions=[

        [-1.25,.45,-1.65],

        [1.25,.45,-1.65],

        [-1.25,.45,1.65],

        [1.25,.45,1.65]

    ];


    wheelPositions.forEach(
        pos=>{

            const wheel=
                new THREE.Mesh(

                    new THREE.CylinderGeometry(
                        .48,
                        .48,
                        .35,
                        20
                    ),

                    new THREE.MeshStandardMaterial({

                        color:0x050505,

                        roughness:.7

                    })

                );


            wheel.rotation.z=
                Math.PI/2;


            wheel.position.set(
                ...pos
            );


            wheel.castShadow=true;


            car.add(
                wheel
            );


            wheels.push(
                wheel
            );

        }
    );


    /* HEADLIGHTS */

    [-.75,.75].forEach(
        x=>{

            const light=
                new THREE.SpotLight(
                    0xffffff,
                    18,
                    60,
                    .38,
                    .4,
                    1
                );


            light.position.set(
                x,
                1,
                -2.5
            );


            light.target.position.set(
                x,
                0,
                -25
            );


            car.add(
                light
            );


            car.add(
                light.target
            );

        }
    );


    /* TAIL LIGHTS */

    [-.75,.75].forEach(
        x=>{

            const tail=
                new THREE.Mesh(

                    new THREE.BoxGeometry(
                        .5,
                        .12,
                        .08
                    ),

                    new THREE.MeshBasicMaterial({
                        color:0xff1025
                    })

                );


            tail.position.set(
                x,
                1,
                2.5
            );


            car.add(
                tail
            );

        }
    );


    car.position.set(
        0,
        0,
        0
    );


    scene.add(
        car
    );

}


/* =========================================================
   TRAFFIC
========================================================= */

function createTraffic(){

    for(
        let i=0;
        i<12;
        i++
    ){

        const vehicle=
            createTrafficCar();


        vehicle.position.set(

            [-6,-2,2,6]
            [
                Math.floor(
                    Math.random()*4
                )
            ],

            0,

            -60-
            i*70-
            Math.random()*40

        );


        vehicle.userData.speed=
            15+
            Math.random()*20;


        traffic.push(
            vehicle
        );


        scene.add(
            vehicle
        );

    }

}


/* =========================================================
   TRAFFIC CAR
========================================================= */

function createTrafficCar(){

    const group=
        new THREE.Group();


    const colors=[

        0xff2233,

        0xffcc22,

        0x22aaff,

        0xffffff,

        0x55dd77

    ];


    const body=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                2,
                .65,
                4
            ),

            new THREE.MeshStandardMaterial({

                color:
                    colors[
                        Math.floor(
                            Math.random()*
                            colors.length
                        )
                    ],

                metalness:.5,

                roughness:.35

            })

        );


    body.position.y=.8;


    const cabin=
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.55,
                .7,
                1.7
            ),

            new THREE.MeshStandardMaterial({

                color:0x101820,

                roughness:.15

            })

        );


    cabin.position.set(
        0,
        1.35,
        .3
    );


    group.add(
        body,
        cabin
    );


    return group;

}


/* =========================================================
   RAIN
========================================================= */

function createRain(){

    const geometry=
        new THREE.BufferGeometry();


    const positions=[];


    for(
        let i=0;
        i<1200;
        i++
    ){

        positions.push(

            (Math.random()-.5)*80,

            Math.random()*35,

            (Math.random()-.5)*200

        );

    }


    geometry.setAttribute(

        "position",

        new THREE.Float32BufferAttribute(
            positions,
            3
        )

    );


    const material=
        new THREE.PointsMaterial({

            color:0x9ecfff,

            size:.08,

            transparent:true,

            opacity:.55

        });


    const points=
        new THREE.Points(
            geometry,
            material
        );


    rain.push(
        points
    );


    scene.add(
        points
    );

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    started=true;

    horrorActive=false;

    horrorTimer=0;

    horrorLaughStarted=false;


    startAudio();


    if(audioContext.state==="suspended"){

        audioContext.resume();

    }


    document.getElementById(
        "start"
    ).classList.add(
        "hidden"
    );


    clock.start();

}


/* =========================================================
   PLAYER PHYSICS
========================================================= */

function updateCar(dt){

    if(!started)
        return;


    const accelerating=
        keys["w"] ||
        keys["arrowup"];


    const braking=
        keys["s"] ||
        keys["arrowdown"];


    /* ACCELERATION */

    if(accelerating){

        speed+=
            ACCELERATION*
            dt;

    }

    else{

        if(speed>0){

            speed-=
                FRICTION*
                dt;


            speed=
                Math.max(
                    0,
                    speed
                );

        }

    }


    /* BRAKE / REVERSE */

    if(braking){

        if(speed>0){

            speed-=
                BRAKE*
                dt;

        }

        else{

            speed-=
                ACCELERATION*
                .45*
                dt;

        }

    }


    speed=
        THREE.MathUtils.clamp(

            speed,

            -REVERSE_SPEED,

            MAX_SPEED

        );


    /* STEERING */

    const left=
        keys["a"] ||
        keys["arrowleft"];


    const right=
        keys["d"] ||
        keys["arrowright"];


    let targetSteer=0;


    if(left)
        targetSteer=-1;


    if(right)
        targetSteer=1;


    steering=
        THREE.MathUtils.lerp(

            steering,

            targetSteer,

            dt*7

        );


    const steerStrength=
        .035+
        Math.abs(speed)/
        MAX_SPEED*
        .055;


    car.rotation.y-=
        steering*
        steerStrength*
        speed*
        dt;


    /* FORWARD */

    const direction=
        new THREE.Vector3(
            0,
            0,
            -1
        );


    direction.applyQuaternion(
        car.quaternion
    );


    car.position.add(

        direction.multiplyScalar(
            speed*dt
        )

    );


    /* ROAD LIMIT */

    car.position.x=
        THREE.MathUtils.clamp(

            car.position.x,

            -8.5,

            8.5

        );


    /* WHEEL ROTATION */

    wheels.forEach(
        wheel=>{

            wheel.rotation.x-=
                speed*
                dt*
                1.7;

        }
    );


    distance+=
        Math.abs(speed)*
        dt;


    updateHUD();

}


/* =========================================================
   TRAFFIC UPDATE
========================================================= */

function updateTraffic(dt){

    traffic.forEach(
        (vehicle,index)=>{


            /* =============================================
               NORMAL TRAFFIC
            ============================================= */

            if(!horrorActive){

                vehicle.position.z+=
                    vehicle.userData.speed*
                    dt;


                /* RECYCLE */

                if(
                    vehicle.position.z>
                    car.position.z+60
                ){

                    vehicle.position.z=
                        car.position.z-
                        600-
                        Math.random()*100;


                    vehicle.position.x=
                        [-6,-2,2,6]
                        [
                            Math.floor(
                                Math.random()*4
                            )
                        ];

                }


                /* COLLISION */

                const dx=
                    Math.abs(

                        vehicle.position.x-
                        car.position.x

                    );


                const dz=
                    Math.abs(

                        vehicle.position.z-
                        car.position.z

                    );


                if(
                    dx<2 &&
                    dz<3
                ){

                    triggerHorror();

                    return;

                }

            }


            /* =============================================
               HORROR SWARM
            ============================================= */

            if(horrorActive){

                const angle=
                    vehicle.userData.horrorAngle+
                    horrorTimer*
                    (
                        1.2+
                        index*.025
                    );


                const radius=
                    Math.max(

                        1.7,

                        vehicle.userData.horrorRadius-
                        horrorTimer*1.35

                    );


                const targetX=
                    car.position.x+
                    Math.cos(angle)*
                    radius;


                const targetZ=
                    car.position.z+
                    Math.sin(angle)*
                    radius;


                vehicle.position.x=
                    THREE.MathUtils.lerp(

                        vehicle.position.x,

                        targetX,

                        dt*2.5

                    );


                vehicle.position.z=
                    THREE.MathUtils.lerp(

                        vehicle.position.z,

                        targetZ,

                        dt*2.5

                    );


                /* FACE THE PLAYER */

                vehicle.lookAt(

                    car.position.x,

                    vehicle.position.y,

                    car.position.z

                );


                /* FLOATING / JUMPING MOTION */

                vehicle.position.y=
                    Math.abs(

                        Math.sin(

                            horrorTimer*12+
                            index

                        )

                    )*.45;


                /* SHAKING */

                vehicle.rotation.z=
                    Math.sin(

                        horrorTimer*9+
                        index

                    )*.08;

            }

        }
    );

}


/* =========================================================
   RAIN UPDATE
========================================================= */

function updateRain(dt){

    rain.forEach(
        points=>{

            const positions=
                points.geometry
                    .attributes
                    .position
                    .array;


            for(
                let i=1;
                i<positions.length;
                i+=3
            ){

                positions[i]-=
                    25*dt;


                if(
                    positions[i]<0
                ){

                    positions[i]=35;

                }

            }


            points.geometry
                .attributes
                .position
                .needsUpdate=true;


            points.position.z=
                car.position.z;

        }
    );

}


/* =========================================================
   DAMAGE
========================================================= */

function damage(){

    health-=10;


    health=
        Math.max(
            0,
            health
        );


    const damageElement=
        document.getElementById(
            "damage"
        );


    damageElement.style.borderWidth=
        "25px";


    setTimeout(()=>{

        damageElement.style.borderWidth=
            "0";

    },150);


    if(health<=0){

        speed=0;

        started=false;


        setTimeout(()=>{

            alert(

                "CAR DESTROYED!\nDistance: "+
                Math.floor(distance)+
                " m"

            );


            location.reload();

        },100);

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

    const desired=
        new THREE.Vector3(
            0,
            4.5,
            10
        );


    desired.applyQuaternion(
        car.quaternion
    );


    desired.add(
        car.position
    );


    camera.position.lerp(

        desired,

        1-
        Math.pow(
            .001,
            dt
        )

    );


    const look=
        car.position.clone();


    look.y+=1;


    camera.lookAt(
        look
    );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    const kmh=
        Math.round(

            Math.abs(speed)*
            3.6

        );


    document.getElementById(
        "speed"
    ).textContent=
        kmh;


    let gear="N";


    if(speed>2){

        gear=
            kmh>80
            ?"5"

            :kmh>60
            ?"4"

            :kmh>40
            ?"3"

            :kmh>20
            ?"2"

            :"1";

    }


    if(speed<0)
        gear="R";


    document.getElementById(
        "gear"
    ).textContent=
        "GEAR "+
        gear;


    document.getElementById(
        "score"
    ).textContent=
        Math.floor(distance)+
        " m";

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );


    const dt=
        Math.min(

            clock.getDelta(),

            .05

        );


    updateCar(dt);

    updateTraffic(dt);

    updateRain(dt);

    updateCamera(dt);

    updateEngineSound();


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    camera.aspect=
        innerWidth/
        innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        innerWidth,

        innerHeight

    );

}


/* =========================================================
   START
========================================================= */

init();

</script>

</html>
