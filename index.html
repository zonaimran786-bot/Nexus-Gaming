<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS Gaming</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #070b14;
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: #0d1322;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #00eaff;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
        }

        nav a:hover {
            color: #00eaff;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #00eaff;
        }

        .hero p {
            font-size: 18px;
            color: #aab4c6;
            margin-bottom: 35px;
        }

        .play {
            display: inline-block;
            padding: 15px 35px;
            background: #00eaff;
            color: #071018;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }

        .play:hover {
            background: white;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">NEXUS</div>

    <div>
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="tournaments.html">Tournaments</a>
        <a href="shop.html">Shop</a>
        <a href="community.html">Community</a>
        <a href="login.html">Login</a>
    </div>
</nav>

<section class="hero">
    <h1>PLAY. <span>COMPETE.</span><br>DOMINATE.</h1>

    <p>
        Welcome to NEXUS Gaming — play games, compete in tournaments
        and climb the leaderboard.
    </p>

    <a class="play" href="game/index.html">PLAY GAME</a>
</section>

</body>
</html>
